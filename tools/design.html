<!doctype html><html><head><meta charset="utf-8"><title>design</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}
#lab{position:fixed;left:0;right:0;bottom:6px;color:#fff;font:bold 13px monospace;text-align:center;text-shadow:0 1px 3px #000}</style></head>
<body><canvas id="c"></canvas><div id="lab"></div>
<script type="module">
// Design review tool. Params:
//  mod=<module path>  id=<export key or comma list> | all=1 (every design in module's DESIGNS or named exports)
//  views=1|3 (3 = front-3/4, side, back)   act=<action> t=<seconds> mode=<mode> speed=<m/s>
//  h=<hour>  dist=<camera distance mult>  q=high|medium|low
import * as THREE from '../vendor/three.module.js';
import { Gfx } from '../src/gfx/renderer.js';
import { buildModel, getTemplate, formDesign } from '../src/gfx/model.js';
import { Animator } from '../src/gfx/anim.js';
import { toonMaterial } from '../src/gfx/materials.js';
import { tickEmitters } from '../src/gfx/emitters.js';
const q = new URLSearchParams(location.search);
const mod = await import(q.get('mod') || '../src/data/species/_test.js');
const pool = mod.DESIGNS || mod.default || mod;
let ids = q.get('id') ? q.get('id').split(',') : Object.keys(pool).filter((k) => pool[k] && pool[k].parts);
if (!q.get('id') && !q.has('all')) ids = ids.slice(0, 1);
const g = new Gfx(document.getElementById('c'), { quality: q.get('q') || 'high' });
g.resize(innerWidth, innerHeight);
g.setTime(parseFloat(q.get('h') || '14'));
if (g.post) g.post.u.uTilt.value = 0;
const views = parseInt(q.get('views') || (ids.length > 1 ? '1' : '3'));
const items = [];
let cursor = 0, maxH = 0, info = [];
const rots = views === 3 ? [0.55, Math.PI / 2, Math.PI + 0.4] : [0.5];
for (const id of ids) {
  let d = typeof pool[id] === 'function' ? pool[id]() : pool[id];
  if (!d) continue;
  if (q.get('form')) d = formDesign(d, q.get('form'));
  const t0 = performance.now();
  const tpl = getTemplate(d, id + (q.get('form') || '') + '_view');
  const ms = (performance.now() - t0).toFixed(0);
  const b = tpl.bounds;
  const w = Math.max(b.max.x - b.min.x, b.max.z - b.min.z, 0.4);
  for (const r of rots) {
    const m = buildModel(d, id + (q.get('form') || '') + '_view');
    if (q.has('bond') || q.get('form')) {
      const rig = m.userData.rig;
      for (const n of (rig.tagged && rig.tagged.bond) || []) rig.bones[n].visible = true;
      for (const [n, k] of Object.entries((rig.bond && rig.bond.grow) || {})) if (rig.bones[n]) rig.bones[n].scale.setScalar(k);
    }
    if (q.get('hat') && m.userData.rig.hat) {
      // trainer accessory on the bond anchor (bond.hat), e.g. &hat=cap|beanie|straw_hat|headset|sunglasses|crown
      const { hatDesign } = await import('../src/data/designs/hats.js');
      const rig = m.userData.rig, a = rig.hat, hd = hatDesign(q.get('hat'));
      const hm = buildModel(hd, hd.id);
      const bone = rig.bones[a.part || 'head'] || m;
      const piv = (getTemplate(d, id + (q.get('form') || '') + '_view').parts.find((p) => p.name === (a.part || 'head')) || { pivot: [0, 0, 0] }).pivot;
      hm.position.set(a.at[0] - piv[0], a.at[1] - piv[1], a.at[2] - piv[2]);
      hm.rotation.set((a.tilt || 0) * Math.PI / 180, 0, (a.roll || 0) * Math.PI / 180);
      hm.scale.setScalar(a.scale || 1);
      bone.add(hm);
    }
    const x = cursor + w * 0.6;
    m.position.set(x, 0, 0); m.rotation.y = r;
    g.actors.add(m);
    const a = new Animator(m);
    if (q.get('mode')) a.setMode(q.get('mode'));
    if (q.get('speed')) a.setSpeed(parseFloat(q.get('speed')));
    items.push({ m, a });
    cursor += w * 1.25;
  }
  maxH = Math.max(maxH, b.max.y);
  info.push(`${id}: ${tpl.faces} faces, h=${b.max.y.toFixed(2)}m, ${ms}ms`);
}
const span = cursor;
const ground = new THREE.Mesh(new THREE.CircleGeometry(Math.max(6, span), 64), toonMaterial({ vertexColors: false, color: 0x86c06a }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; g.world.add(ground);
ground.position.x = span / 2;
const dm = parseFloat(q.get('dist') || '1');
const aspect = innerWidth / innerHeight;
const fitW = span / aspect, fitH = maxH * 1.3;
const dist = Math.max(fitW, fitH) / (2 * Math.tan(15 * Math.PI / 180)) * 1.05 * dm + 0.5;
g.rig.pitch = parseFloat(q.get('pitch') || '0.28'); g.rig.yawT = 0; g.rig.yaw = 0;
g.rig.target.set(span / 2, maxH * 0.48, 0); g.rig.distT = dist; g.rig.snap();
document.getElementById('lab').textContent = info.join('  |  ');
const T = parseFloat(q.get('t') || '0.8');
const act = q.get('act');
if (act) for (const it of items) it.a.play(act);
const N = Math.round(T * 60);
const rr = g.renderer.render.bind(g.renderer); const post = g.post;
g.renderer.render = () => {}; g.post = null;
for (let i = 0; i < N; i++) { for (const it of items) { it.a.update(1 / 60); tickEmitters(g.fx, it.m.userData.rig, 1 / 60); } g.frame(1 / 60); }
g.renderer.render = rr; g.post = post;
g.frame(1 / 60);
window.__info = info;
document.title = 'ready';
if (q.has('live')) { let last = performance.now(); const loop = (now) => { const dt = Math.min(0.05, (now - last) / 1000); last = now; for (const it of items) { it.a.update(dt); tickEmitters(g.fx, it.m.userData.rig, dt); } g.frame(dt); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script></body></html>
