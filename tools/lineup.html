<!doctype html><html><head><meta charset="utf-8"><title>lineup</title>
<style>html,body{margin:0;background:#101018;overflow:hidden}canvas{display:block}#err{position:fixed;top:0;left:0;color:#f66;font:12px monospace;white-space:pre}</style>
</head><body><canvas id="c"></canvas><div id="err"></div>
<script type="module">
// A lineup of people and/or Tokonmon side by side: ?people=hero,coach,mika&mons=chilichick&clip=idle&t=1&yaw=&pitch=&dist=
window.onerror = (m, s, l) => { document.getElementById('err').textContent += m + ' @' + l + '\n'; };
import { VxStage } from '../src/vx/stage.js';
import { Fine } from '../src/vx/fine.js';
import { Kit } from '../src/vx/kit.js';
import { Model } from '../src/vx/model.js';
import { Animator } from '../src/vx/anim.js';
import { FX } from '../src/vx/fx.js';
import { HD2D } from '../src/px/hd2d.js';
import { cast, castVox } from '../src/vx/people/cast.js';
const q = new URLSearchParams(location.search), num = (k, d) => (q.has(k) ? +q.get(k) : d);
const W = num('w', 1600), H = num('h', 720);
const defs = [];
for (const n of (q.get('people') || '').split(',').filter(Boolean)) defs.push(q.get('box') ? cast(n) : { vox: n });
for (const n of (q.get('mons') || '').split(',').filter(Boolean)) defs.push((await import('../src/vx/mons/' + n + '.js')).def);
const st = new VxStage({ fov: num('fov', 28), shadowSize: 2048 });
const fw = new Fine(160, 8, 96, 16), k = new Kit(fw);
k.box(0, 0, 0, 159, 3, 95, 'sidewalk', 'patch', { sc: 6 });
st.setSize(W, H); if (q.get('ink') !== '0') st.setStyle({ ink: true, toon: q.get('toon') !== '0', inkCrease: 0.03 }); st.setWorld(fw); st.setMood(q.get('mood') || 'golden');
const gap = num('gap', 1.15), x0 = 5 - ((defs.length - 1) * gap) / 2, fx = new FX(st), ans = [];
defs.forEach((d, i) => { const m = d.vox ? castVox(d.vox) : new Model(d); m.group.position.set(x0 + i * gap, 0.25, 3); st.scene.add(m.group); const a = new Animator(m); if (q.get('clip')) a.play(q.get('clip'), { fade: 0 }); ans.push(a); });
st.look([5, 0.25 + num('ty', 0.7), 3], num('dist', 7), num('yaw', 0), num('pitch', 8));
const DT = 1 / 60; for (let i = 0; i < Math.round(num('t', 1) / DT); i++) { for (const a of ans) a.update(DT, { fx }); fx.update(DT); st.time += DT; }
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const post = new HD2D(cv); Object.assign(post.opts, { focus: 0.5, band: 0.7, dof: 0.2, bloom: 0.4, threshold: 0.82, rays: 0, vig: 0.3, warm: 0.3, sat: 1.05, contrast: 1.05 });
post.draw(st.render(), 0.5); document.title = 'ready';
</script></body></html>
