<!doctype html><html><head><meta charset="utf-8"><title>ui</title>
<style>
html,body{margin:0;background:#1a120a;color:#f6ead0;font:12px monospace;overflow:hidden}
#bgc{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}#cv{position:absolute;left:0;top:0;display:block;cursor:pointer}
#nav{position:fixed;right:6px;bottom:4px;opacity:.55}#nav a{color:#ffcf5a;margin-left:6px}
#err{position:fixed;left:0;top:0;color:#f66;white-space:pre;background:#000c}
</style></head><body><canvas id="bgc"></canvas><canvas id="cv"></canvas><div id="nav"></div><div id="err"></div>
<script type="module">
// UI kit gallery: ?screen=gallery|icons|hud|dialog|dialog2|prompts|name|cards|cards3|menu  &w=480&h=270&zoom=3&frames=90&bg=day|night&tab=party|bag|map|save|options|close
window.onerror = (m, s, l) => { document.getElementById('err').textContent += m + ' @' + l + '\n'; };
import { PixelUI, T, loadUIFont } from '../src/px/game/ui.js';
import { BIG, SMALL } from '../src/px/game/uikit/icons.js';
import { Surf } from '../src/px/surface.js';
import { bayer, mix } from '../src/px/color.js';
import * as S from '../src/game/state.js';
import { createElemon } from '../src/game/elemon.js';
import { SPECIES } from '../src/data/species.js';
import { Hud } from '../src/vx/game/hud.js';
import { SFPhone } from '../src/vx/game/phone.js';

const q = new URLSearchParams(location.search);
const screen = q.get('screen') || 'gallery';
const W = +(q.get('w') || 640), H = +(q.get('h') || 360), Z = +(q.get('zoom') || 2);
const cv = document.getElementById('cv'); cv.style.width = W * Z + 'px'; cv.style.height = H * Z + 'px';
const bgc = document.getElementById('bgc'); bgc.width = W; bgc.height = H; bgc.style.width = W * Z + 'px'; bgc.style.height = H * Z + 'px';
document.getElementById('nav').innerHTML = ['gallery', 'icons', 'hud', 'dialog', 'dialog2', 'prompts', 'name', 'cards', 'cards3', 'menu'].map((s) => `<a href="?screen=${s}&w=${W}&h=${H}&zoom=${Z}">${s}</a>`).join('');
const ui = new PixelUI(W, H, { canvas: cv, pw: W * Z * (devicePixelRatio || 1), ph: H * Z * (devicePixelRatio || 1) });

// ---------------------------------------------------------------- a fake "world" behind the UI: a sunny park (bg=night: the old night street)
const bg = new Surf(W, H);
(function paintWorld() {
  if (q.get('bg') === 'night') {
    bg.vgrad(0, 0, W, H * 0.62, ['#1a1440', '#3a2a6a', '#8a4a7a', '#e88a6a'], true);
    let x = 0, k = 0;
    while (x < W) { const bw = 26 + ((k * 37) % 30), bh = 50 + ((k * 53) % 70); bg.rect(x, H * 0.62 - bh, bw, bh, k % 2 ? '#2a2048' : '#241a3e'); for (let j = H * 0.62 - bh + 6; j < H * 0.62 - 6; j += 9) for (let i = x + 4; i < x + bw - 4; i += 7) if (((i * 7 + j * 3) % 5) > 1) bg.rect(i, j, 3, 4, ((i + j) % 3) ? '#ffcf7a' : '#5a4a8a'); x += bw + 2; k++; }
    bg.vgrad(0, Math.floor(H * 0.62), W, Math.ceil(H * 0.38), ['#4a3a5a', '#3a2c48', '#241a30'], true);
    return;
  }
  const hz = Math.floor(H * 0.5);
  bg.vgrad(0, 0, W, hz, ['#7cc6ea', '#a8dcf0', '#d8f0f0'], true);
  for (const [cx, cy, r] of [[80, 40, 16], [100, 36, 20], [124, 42, 14], [330, 28, 14], [350, 24, 18], [372, 30, 12]]) bg.ellipse(cx, cy, r, r * 0.6, '#ffffff');
  for (let i = 0; i < W; i++) { const th = 26 + Math.round(10 * Math.sin(i * 0.05) + 6 * Math.sin(i * 0.13 + 1)); for (let j = hz - th; j < hz; j++) bg.px(i, j, j < hz - th + 3 ? '#6aa84a' : (bayer(i, j) < 0.5 ? '#4f8a3a' : '#467e34')); }
  bg.vgrad(0, hz, W, H - hz, ['#8cc860', '#76b24e', '#5f9a40'], true);
  for (let i = 0; i < 220; i++) { const x = (i * 97) % W, y = hz + 4 + ((i * 53) % (H - hz - 6)); bg.px(x, y, '#a8dc78'); bg.px(x + 1, y - 1, '#a8dc78'); }
  // a path
  for (let j = hz; j < H; j++) { const c = W * 0.55 + (j - hz) * 0.5, hw = 10 + (j - hz) * 0.35; for (let i = Math.round(c - hw); i < c + hw; i++) bg.px(i, j, bayer(i, j) < 0.2 ? '#c8a878' : '#dcc090'); }
  // trees
  for (const tx of [40, 190, 420]) { bg.rect(tx - 2, hz - 20, 5, 26, '#6a4428'); bg.ellipse(tx, hz - 28, 18, 14, '#3f7a30'); bg.ellipse(tx - 4, hz - 32, 12, 9, '#58963c'); }
})();

// ---------------------------------------------------------------- sample data
const party = [
  { name: 'Kindoru', hp: 54, maxHp: 60, color: '#ff6a2b', level: 7 },
  { name: 'Takopo', hp: 18, maxHp: 58, color: '#2fa8ff', level: 6 },
  { name: 'Mochika', hp: 9, maxHp: 52, color: '#5fd35a', level: 5 },
  { name: 'Pidgun', hp: 0, maxHp: 40, color: '#d39a5c', level: 4 },
];
function drawSampleMap(ui, x, y, w, h) {
  const s = ui.s;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const X = x + i, Y = y + j, gx = (i + 3) % 16, gy = (j + 5) % 14;
    let c = '#3a5a3a';
    if (gx < 3 || gy < 3) c = '#8a8094'; else if ((Math.floor((i + 3) / 16) + Math.floor((j + 5) / 14)) % 3 === 0) c = '#5a4a6e';
    if ((i - j * 0.6 - 10) > 26 && (i - j * 0.6 - 10) < 34) c = '#3a6aa8';
    s.px(X, Y, bayer(X, Y) < 0.15 ? mix(c, '#000000', 0.2) : c);
  }
  for (const [px, py, c] of [[12, 10, '#ffcf5a'], [w - 14, h - 12, '#ff7ab8'], [w - 20, 12, '#ffcf5a']]) { s.rect(x + px, y + py, 2, 2, c); }
  const ax = x + (w >> 1), ay = y + (h >> 1);
  for (let t = -2; t <= 3; t++) s.px(ax, ay - t, t > 1 ? '#ffffff' : '#e8473a');
  s.px(ax - 1, ay - 1, '#e8473a'); s.px(ax + 1, ay - 1, '#e8473a');
}
// stand-in for the portrait slot (the game passes a 3D render canvas): a Tokonmon-style creature emblem, no human art
const portrait = (ui, x, y, size) => ui.emblem('party', x + (size >> 1), y + (size >> 1) + 1, size >= 64 ? 4 : 2);

// ---------------------------------------------------------------- fake app for the HUD
function fakeApp() {
  const st = S.newGame({ name: 'Ren' });
  const ids = Object.keys(SPECIES);
  for (const [sp, lv, hp] of [[ids[0], 7, 0.9], [ids[2], 6, 0.3], [ids[4], 5, 0.15], [ids[6], 4, 0]]) { const m = createElemon(sp, { level: lv }); m.hp = hp; st.party.push(m); }
  st.money = 12480; st.time = { day: 3, hour: 19.6 }; st.bag = { takoyaki: 3, ramune: 2, matcha: 1, revive_onigiri: 1, ramen: 4 };
  st.dex.seen = { pidgun: true, lemmo: true, cabbunny: true, zapkit: true }; st.dex.caught = { chilichick: true };
  st.unlocks.locations.push('alamo', 'chinatown');
  const app = { ui, state: st, t: 0, toast: (s, o) => ui.toast(s, o), save() { ui.toast('Game saved', { icon: 'save', color: T.green }); },
    quests: { list: () => [{ id: 'tarts', title: 'Egg tarts for Mom', steps: ['Pick up egg tarts at Lucky Moon', 'Bring them home'], step: 0, active: true, main: true }, { id: 'chess', title: 'Uncle Ho\'s challenge', steps: ['Beat Uncle Ho in Portsmouth Square'], step: 0, active: true }, { id: 'pier', title: 'Seal of approval', active: false }] },
    world: { loc: { name: 'Chinatown' }, zoneName: 'Grant Avenue', drawMinimap: (ui, x, y, w, h) => drawSampleMap(ui, x, y, w, h), city: { active: () => screen === 'hud', pad: null, touch: false } },
    search: { near: null, scan() { return screen === 'hud' ? (this.near = { x: 0, z: 0 }) : null; }, enter() {} },
    audio: { sfx() {}, setVolumes() {} }, story: { run: (f) => f() }, keysDown: {} };
  return app;
}

// ---------------------------------------------------------------- screens
let hud = null, app = null;
function hoverAt(x, y, down = false) { ui.ptr.x = x; ui.ptr.y = y; ui.ptr.down = down; }
function gallery() {
  // a sheet of the pixel GUI on the 640×360 art grid
  // party card (portrait slot with a stand-in emblem: the game puts the live 3D render there)
  ui.panel(8, 8, 214, 76, {});
  ui.panel(14, 16, 54, 54, { thin: true, r: 1, fill: T.creamD, shadow: false }); ui.emblem('party', 41, 43, 2);
  ui.panel(74, 14, 116, 13, { thin: true, r: 1, fill: T.creamL, shadow: false }); ui.gem(79, 20, T.copperL, 2); ui.gem(184, 20, T.copperL, 2);
  ui.text('REN', 132, 18, T.text, { mini: true, bold: true, align: 'center' });
  ui.panel(192, 13, 22, 15, { thin: true, r: 1, fill: T.copperL, shadow: false }); ui.text('32', 203, 17, '#ffffff', { mini: true, bold: true, align: 'center', outline: T.copperD });
  ui.text('ROOKIE TAMER', 144, 31, T.dim, { mini: true, align: 'center' });
  [['HP', 1, 'green', '43/43'], ['BOND', 0.86, 'blue', '54/61'], ['EXP', 0.62, 'orange', '196/225']].forEach(([l, v, c, t], i) => { const y = 41 + i * 12; ui.bar(76, y, 136, 3, v, { color: c, id: 'gc' + i, shine: false }); ui.text(l, 75, y + 5, T.dim, { mini: true }); ui.text(t, 213, y + 5, T.dim, { mini: true, align: 'right' }); });
  // icon buttons on plinths
  ['bag', 'battle', 'quest', 'map', 'shelf'].forEach((ic, i) => ui.plinthButton(26 + i * 42, 94, ic, { size: 32 }));
  // thick capsule bars with brass clamps
  ['dark', 'red', 'blue', 'green'].forEach((c, i) => ui.bar(14, 150 + i * 20, 170, 10, [0.75, 0.82, 0.64, 0.9][i], { color: c, id: 'gt' + i, trail: false }));
  // value pills
  ui.valuePill(200, 148, 92, 'coin', '2183', { color: T.amber });
  ui.valuePill(200, 170, 92, 'sparkle', '52', { color: T.blue });
  ui.valuePill(200, 192, 92, 'clock', '10:45', { color: T.red });
  // buttons in all states
  ui.panel(232, 8, 132, 132, {});
  ui.button(244, 18, 108, 22, 'Normal', { icon: 'play' });
  hoverAt(260, 52); ui.button(244, 46, 108, 22, 'Hover', { icon: 'star', color: T.amber }); hoverAt(-1, -1);
  hoverAt(260, 80, true); ui.button(244, 74, 108, 22, 'Pressed', { icon: 'check', color: T.green }); hoverAt(-1, -1);
  ui.button(244, 102, 52, 18, 'Active', { active: true, color: T.blue, frame: 'copper' });
  ui.button(300, 102, 52, 18, 'Off', { disabled: true });
  ui.roundButton(256, 128, 7, 'menu', { color: T.cream }); ui.roundButton(282, 128, 7, 'gear', { color: T.cream }); ui.roundButton(308, 128, 7, 'save', { color: T.green, badge: 2 }); ui.roundButton(336, 128, 7, 'lens', { color: T.amber, sel: true });
  // name plate banner, keycaps, a prompt bubble
  ui.banner(376, 12, 'QUEST LOG', { icon: 'book' });
  let kx = 376; for (const k of ['E', 'Esc', 'Tab', 'R']) kx += ui.keycap(kx, 32, k) + 3;
  ui.prompt(400, 96, 'E', 'Talk', { label: 'never' }); ui.prompt(430, 96, 'E', 'Door', { label: 'never' }); hoverAt(462, 80); ui.prompt(462, 96, 'E', 'Open the fridge', { icon: 'fridge' }); hoverAt(-1, -1);
  // panels: plain, a dark tag, a pill
  ui.panel(376, 108, 150, 40, {}); ui.text('Dark-brown ink on cream', 384, 118, T.text); ui.text('SMALL PIXEL LABELS 0123', 384, 130, T.dim, { mini: true });
  // icon sheet
  ui.panel(310, 214, 322, 138, {});
  const names = ['phone', 'party', 'book', 'bag', 'map', 'quest', 'gear', 'lens', 'save', 'coin', 'star', 'heart', 'home', 'close', 'check', 'radar', 'fridge', 'shelf', 'soda', 'onigiri', 'candy', 'bun', 'potion', 'trophy', 'talk', 'pin', 'egg', 'music', 'battle', 'sparkle'];
  names.forEach((n, i) => ui.bigIcon(n, 318 + (i % 15) * 20, 222 + Math.floor(i / 15) * 22, null, { scale: 16 / 12 }));
  Object.keys(BIG).slice(0, 26).forEach((n, i) => ui.bigIcon(n, 318 + (i % 13) * 23, 270 + Math.floor(i / 13) * 16));
  ui.text('Detailed 16 px and classic 12 px pixel icons', 318, 334, T.dim, {});
  // HUD bits over the world
  ui.hudLocation(520, 160, 'Chinatown', 'San Francisco');
  ui.minimap(552, 8, 80, 80, drawSampleMap, { label: 'Grant Ave' });
  ui.joystick(40, 300, 20, 0.55, -0.45, true);
  ui.objective(14, 238, 'Find Grandma at the bakery', { maxW: 260 });
  ui.partyBar(84, 280, party, { maxW: 220 });
}
function promptsSheet() {
  ui.panel(4, 4, W - 8, 30, {}); ui.text('Prompts: an icon bubble + the key. Words only on hover (or briefly, the first time).', 12, 15, T.text, { shadow: T.woodDD });
  const rows = [['Talk to Grandma', null], ['Open the door', null], ['Examine', null], ['Buy a drink', 'coin'], ['Radio', 'music'], ['Lamp', 'hand']];
  rows.forEach(([l, ic], i) => { const x = 40 + i * 76; ui.prompt(x, 110, 'E', l, { icon: ic || undefined, label: 'never' }); ui.prompt(x, 190, 'A', l, { icon: ic || undefined, label: 'always' }); ui.text(l, x, 118, T.paperText, { align: 'center', mini: true }); });
  ui.toast('Saved', { icon: 'check', color: T.green, dur: 99 }); ui.toast('Got Takoyaki ×6', { icon: 'bowl', dur: 99 });
  ui.joystick(40, 236, 20, 0, 0, false, { ghost: true }); ui.joystick(440, 236, 20, -0.5, -0.4, true);
}
function iconsSheet() {
  ui.panel(4, 4, W - 8, H - 8, { paper: true });
  const names = Object.keys(BIG);
  names.forEach((n, i) => { const x = 10 + (i % 12) * 38, y = 10 + Math.floor(i / 12) * 26; ui.bigIcon(n, x + 12, y); ui.text(n, x + 18, y + 14, T.paperDim, { mini: true, align: 'center' }); });
  const sm = Object.keys(SMALL), y0 = 10 + Math.ceil(names.length / 12) * 26 + 4;
  sm.forEach((n, i) => { const x = 10 + (i % 20) * 23, y = y0 + Math.floor(i / 20) * 18; ui.icon(n, x + 6, y, T.wood, T.paperE); ui.text(n.slice(0, 5), x + 9, y + 9, T.paperDim, { mini: true, align: 'center' }); });
}
let frameN = 0;
async function setup() {
  if (screen === 'name') ui.nameEntry({ title: "What's your name?", value: 'Ren', max: 10 }).then((v) => ui.toast('Hello, ' + v + '!', { icon: 'heart' }));
  if (screen === 'cards') ui.pickCards({ title: 'Are you a boy or a girl?', cards: [{ label: 'Boy', sub: 'Messy hair, big dreams', color: '#e8603a', icon: 'star' }, { label: 'Girl', sub: 'Ponytail, bigger dreams', color: '#e05a8a', icon: 'heart' }] }).then((i) => ui.toast('Picked ' + i, { icon: 'check' }));
  if (screen === 'cards3') ui.pickCards({ title: 'Choose your partner', cards: [{ label: 'Kindoru', sub: 'Pyro dragon', color: '#ff6a2b', icon: 'flame' }, { label: 'Takopo', sub: 'Hydro octopus', color: '#2fa8ff', icon: 'drop' }, { label: 'Mochika', sub: 'Bio fawn', color: '#5fd35a', icon: 'leaf' }] });
  if (screen === 'hud' || screen === 'menu' || screen === 'dialog' || screen === 'dialog2') { app = fakeApp(); hud = new Hud(app); }
  if (screen === 'menu') { app.phone = new SFPhone(app); hud.openMenu(q.get('tab') || 'home'); }
  if (screen === 'dialog') ui.say('Mika', "Ren! You're finally up. Grandma says the cable car is running again — want to ride it down to the bay with me?", { portrait, choices: ['Sure, let\'s go!', 'Maybe later', 'Who are you again?'] });
  if (screen === 'dialog2') ui.say('Grandma', 'The tram bell rings twice at noon. When it does, follow it down the hill and you will find the bakery.', {});
  if (screen === 'hud') { ui.toast('Saved', { icon: 'check', color: T.green, dur: 99 }); ui.toast('McCarapace Lv 8!', { icon: 'star', color: T.amber, dur: 99 }); ui.toast('Takoyaki ×6', { icon: 'bowl', dur: 99 }); hud.showLocation('Grant Avenue', 'Chinatown'); }
}
function frame(dt) {
  frameN++;
  ui.begin(dt);
  if (screen === 'gallery') gallery();
  else if (screen === 'icons') iconsSheet();
  else if (screen === 'prompts') promptsSheet();
  else if (hud) { app.t += dt; hud.draw(ui, dt); if (app.phone && app.phone.open && app.phone.draw) app.phone.draw(ui, dt); }
  ui.end();
}
let bgDone = false;
function present() { if (bgDone) return; bgDone = true; const img = bgc.getContext('2d').createImageData(W, H); new Uint32Array(img.data.buffer).set(bg.data); bgc.getContext('2d').putImageData(img, 0, 0); }
// input (same mapping as the game)
const p = ui.ptr;
const pos = (e) => { const r = cv.getBoundingClientRect(); p.x = Math.floor(((e.clientX - r.left) / r.width) * W); p.y = Math.floor(((e.clientY - r.top) / r.height) * H); };
cv.addEventListener('pointerdown', (e) => { pos(e); p.down = true; p.pressed = true; });
cv.addEventListener('pointermove', pos);
cv.addEventListener('pointerup', (e) => { pos(e); p.down = false; p.released = true; });
addEventListener('keydown', (e) => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; if (!e.repeat) ui.keys[k] = 'pressed'; });

await setup();
await loadUIFont();
const N = +(q.get('frames') || 100);
const t0 = performance.now();
for (let i = 0; i < N; i++) frame(1 / 60);
console.log('ui frame ms', ((performance.now() - t0) / N).toFixed(3), screen);
if (screen === 'dialog' && q.get('choices') === '0') {}
present();
document.title = 'ready';
let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; frame(dt); present(); requestAnimationFrame(loop); }
if (!q.has('still')) requestAnimationFrame(loop);
</script></body></html>
