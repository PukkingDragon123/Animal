<!doctype html><html><head><meta charset="utf-8"><title>sheet</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#efe6dc;font-family:DotGothic16,monospace;color:#2b1e2e}
#s{padding:16px 22px;width:1560px}
h1{margin:0 0 4px;font-size:34px;letter-spacing:2px} .sub{margin:0 0 10px;font-size:15px;color:#6a5a6e}
.sec{margin:14px 0 4px;display:inline-block;background:#2b1e2e;color:#fff;padding:3px 14px 3px 10px;font-size:16px;letter-spacing:1px;clip-path:polygon(0 0,100% 0,94% 100%,0 100%)}
.row{display:flex;gap:2px;align-items:flex-end;flex-wrap:wrap;border-top:2px solid #2b1e2e;padding-top:6px}
.grp{display:flex;flex-direction:column;align-items:center;margin-right:26px}
.grp .f{display:flex;gap:4px;align-items:flex-end}
.lab{font-size:14px;margin-top:2px}
canvas{image-rendering:pixelated;display:block}
.hero{display:flex;gap:40px;align-items:flex-end;padding:0 20px}
.bg{background:radial-gradient(circle at 50% 70%,#fff8ee 0,#efe6dc 70%)}
</style></head><body><div id="s"></div>
<script type="module">
import { renderFrame, CLIPS } from '../src/px/sdf.js';
import { SPRITES } from '../src/data/sprites/sdf_starters.js';
await new Promise((r) => setTimeout(r, 50));
const q = new URLSearchParams(location.search), id = q.get('id') || 'chilichick', d = SPRITES[id];
const root = document.getElementById('s');
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt) e.textContent = txt; return e; };
// crop each frame horizontally to its pixels (keeps the full height so feet stay on one baseline)
const cv = (surf, z) => {
  let x0 = surf.w, x1 = -1, y0 = surf.h; for (let y = 0; y < surf.h; y++) for (let x = 0; x < surf.w; x++) if (surf.data[y * surf.w + x] >>> 24) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); }
  if (x1 < 0) { x0 = 0; x1 = 1; } x0 = Math.max(0, x0 - 2); x1 = Math.min(surf.w - 1, x1 + 2);
  const top = Math.max(0, Math.min(y0 - 2, +(q.get('top') || 18))), w = x1 - x0 + 1, h = surf.h - top;
  const c = document.createElement('canvas'); c.width = Math.round(w * z); c.height = Math.round(h * z); const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(surf.canvas(), x0, top, w, h, 0, 0, c.width, c.height); return c; };
const F = (clip, frame, o = {}) => renderFrame(d, Object.assign({ clip, frame }, o));
root.append(el('h1', '', (q.get('title') || id).toUpperCase()), el('div', 'sub', q.get('note') || ''));
// hero row
const hero = el('div', 'hero bg');
const heroes = (q.get('hero') || 'idle:0,eat:12,breath:14,sleep:6').split(',').map((s) => s.split(':'));
for (const [c, f] of heroes) hero.append(cv(F(c, +f), +(q.get('hz') || 3)));
root.append(hero);
const section = (title, groups, z = 2) => {
  root.append(el('div', 'sec', title));
  const row = el('div', 'row');
  for (const [label, clip, step, o] of groups) {
    const g = el('div', 'grp'), fr = el('div', 'f');
    const n = CLIPS[clip] || 24;
    for (let i = 0; i < n; i += step) fr.append(cv(F(clip, i, o || {}), z));
    g.append(fr, el('div', 'lab', label)); row.append(g);
  }
  root.append(row);
};
const z = +(q.get('z') || 1.5);
section('IDLE / WALK / RUN', [['Idle', 'idle', 8], ['Walk', 'walk', 2], ['Run', 'run', 2]], z);
section('ATTACKS', [['Peck', 'attack', 3], ['Fire Breath', 'breath', 4], ['Spicy Dash', 'dash', 4], ['Chili Throw', 'throw', 4]], z);
section('HURT / STATUS', [['Hurt', 'hurt', 3], ['KO', 'faint', 6], ['Spicy (Buff)', 'buff', 8], ['Happy', 'happy', 5], ['Sleep', 'sleep', 16], ['Eating Chili (Special)', 'eat', 5]], z);
root.append(el('div', 'sec', 'DIRECTION FACING'));
const dir = el('div', 'row');
for (const y of [0, -45, -90, -135, 180, 135, 90, 45]) dir.append(cv(F('idle', 0, { yaw: y }), z));
root.append(dir);
document.title = 'ready';
</script></body></html>
