<!doctype html><html><head><meta charset="utf-8"><title>viewer</title>
<style>html,body{margin:0;height:100%;background:#202830;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import * as THREE from '../vendor/three.module.js';
import { buildModel } from '../src/gfx/model.js';
import { Animator } from '../src/gfx/anim.js';
import { shared } from '../src/gfx/materials.js';
const q = new URLSearchParams(location.search);
const mod = await import(q.get('mod') || '../src/data/species/_test.js');
const key = q.get('id') || Object.keys(mod)[0];
const designs = (key === '*') ? Object.values(mod) : [mod[key]];
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fc6e6);
const cam = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.1, 100);
const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x8a6a58, 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dd, 2.6); sun.position.set(3, 6, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 }); sun.shadow.bias = -0.0005;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshToonMaterial({ color: 0x7fbf5a }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const anims = [];
const n = designs.length, cols = Math.ceil(Math.sqrt(n));
let maxH = 0.5;
designs.forEach((d, i) => {
  const m = buildModel(d);
  const r = m.userData.rig;
  maxH = Math.max(maxH, r.height, r.radius * 1.2);
  const gx = (i % cols) - (cols - 1) / 2, gz = Math.floor(i / cols) - (Math.ceil(n / cols) - 1) / 2;
  m.position.set(gx * 1.4 * maxH, 0, gz * 1.4 * maxH);
  m.rotation.y = parseFloat(q.get('rot') || '0.6');
  scene.add(m);
  const a = new Animator(m);
  const act = q.get('act'); const mode = q.get('mode');
  if (mode) a.setMode(mode);
  a.setSpeed(parseFloat(q.get('speed') || '0'));
  anims.push({ a, act, m });
});
const span = Math.max(1, cols) * 1.4 * maxH;
const dist = parseFloat(q.get('dist') || (span * 2.4 + 1.2));
const camY = parseFloat(q.get('camy') || '0.55');
cam.position.set(0, dist * camY, dist); cam.lookAt(0, maxH * 0.45, 0);
let t = parseFloat(q.get('t') || '0.7');
// advance animation deterministically to time t
for (const x of anims) { if (x.act) x.a.play(x.act); }
const steps = Math.round(t / (1 / 60));
for (let i = 0; i < steps; i++) for (const x of anims) x.a.update(1 / 60);
shared.uTime.value = t;
renderer.render(scene, cam);
document.title = 'ready';
window.__loop = () => { let last = performance.now(); const f = (now) => { const dt = (now - last) / 1000; last = now; for (const x of anims) x.a.update(dt); renderer.render(scene, cam); requestAnimationFrame(f); }; requestAnimationFrame(f); };
if (q.has('live')) window.__loop();
</script></body></html>
