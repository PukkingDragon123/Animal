<!doctype html><html><head><meta charset="utf-8"><title>vx</title>
<style>html,body{margin:0;background:#101018;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}#err{position:fixed;top:0;left:0;color:#f66;font:12px monospace;white-space:pre}</style>
</head><body><canvas id="c"></canvas><div id="err"></div>
<script type="module">
// Voxel scene preview: ?scene=test&mood=day|golden|night&tx=&ty=&tz=&dist=&yaw=&pitch=&fov=&w=&h=&post=0
window.onerror = (m, s, l) => { document.getElementById('err').textContent += m + ' @' + l + '\n'; };
await new Promise((r) => setTimeout(r, 30));
import { VxStage } from '../src/vx/stage.js';
import { HD2D } from '../src/px/hd2d.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1280), H = +(q.get('h') || 720);
const mod = await import('../src/vx/scenes/' + (q.get('scene') || 'test') + '.js');
const t0 = performance.now();
const sc = mod.build({ mood: q.get('mood') || undefined });
console.log('build ms', Math.round(performance.now() - t0));
const st = new VxStage({ fov: +(q.get('fov') || 32) });
st.setSize(W, H); const t1 = performance.now(); st.setWorld(sc.vox); console.log('mesh ms', Math.round(performance.now() - t1)); st.setMood(q.get('mood') || sc.mood || 'day');
if (sc.lamps) for (const L of sc.lamps) st.lamp(L[0], L[1], L[2]);
if (sc.setup) sc.setup(st);
const v = sc.view || {};
st.look([+(q.get('tx') ?? v.target[0]), +(q.get('ty') ?? v.target[1]), +(q.get('tz') ?? v.target[2])], +(q.get('dist') || v.dist), +(q.get('yaw') ?? v.yaw ?? 0), +(q.get('pitch') ?? v.pitch ?? 52));
const frame = st.render();
console.log('build+render ms', Math.round(performance.now() - t0));
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
if (q.get('post') === '0') { const g = cv.getContext('2d'); g.drawImage(frame, 0, 0); }
else { const post = new HD2D(cv); Object.assign(post.opts, { focus: 0.5, band: 0.28, dof: 0.6, bloom: 0.45, threshold: 0.82, rays: 0.05, vig: 0.45, warm: 0.4, sat: 1.08, contrast: 1.06 }, st.moodName === 'night' ? { night: 0.15, bloom: 0.9, threshold: 0.6, rays: 0 } : {}); post.draw(frame, 0.5); }
document.title = 'ready';
</script></body></html>
