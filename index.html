<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7fc24a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>Why It Sucks To Be A…</title>
<style>
  :root{
    --cream:#fff7ea; --cream-t:rgba(255,247,234,.92); --ink:#3d3326; --ink-soft:#6b5d49;
    --leaf:#6cc24a; --leaf-d:#4f9a3a; --sky:#8fd0ff; --bark:#6b4f37;
    --pink:#ff7ab0; --amber:#ffb84d; --danger:#ff5b4d; --shadow:0 8px 22px rgba(60,45,25,.22);
    --r:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe9ff;
    font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
    user-select:none;-webkit-user-select:none;touch-action:none;}
  #c{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;}
  #dev{position:fixed;top:6px;left:50%;transform:translateX(-50%);color:#0f0;background:rgba(0,0,0,.5);
    font:12px monospace;padding:2px 8px;border-radius:8px;display:none;z-index:50;}

  /* ---- in-play HUD ---- */
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
  #hud{position:absolute;inset:0;opacity:0;transition:opacity .3s;}
  #hud.show{opacity:1;}
  .lifebar-wrap{position:absolute;top:0;left:0;right:0;height:7px;background:rgba(255,255,255,.25);}
  .lifebar-wrap .fill{height:100%;width:0;background:linear-gradient(90deg,#ffe27a,#ff9b6b,#c98bff);transition:width .2s linear;}
  #stageLabel{position:absolute;top:10px;left:14px;font-weight:800;font-size:15px;color:#fff;
    text-shadow:0 2px 5px rgba(0,0,0,.35);letter-spacing:.3px;}
  .needs{position:absolute;top:32px;left:12px;display:flex;flex-direction:column;gap:7px;width:min(46vw,210px);}
  .need{display:flex;align-items:center;gap:7px;}
  .need .lbl{font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);width:48px;}
  .need .bar{flex:1;height:13px;background:rgba(0,0,0,.22);border-radius:9px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.25);}
  .need .fill{height:100%;width:100%;border-radius:9px;transition:width .15s linear,background .3s;}
  #fillEnergy{background:#6fc7ff;}
  .topright{position:absolute;top:30px;right:12px;display:flex;align-items:center;gap:8px;}
  .dna{background:var(--cream-t);font-weight:800;padding:6px 12px;border-radius:14px;box-shadow:var(--shadow);font-size:15px;}
  .clock{background:var(--cream-t);border-radius:14px;padding:5px 9px;font-size:16px;box-shadow:var(--shadow);}
  .iconbtn{pointer-events:auto;border:none;background:var(--cream-t);width:40px;height:40px;border-radius:14px;
    font-size:18px;box-shadow:var(--shadow);cursor:pointer;}
  .objective{position:absolute;top:74px;left:50%;transform:translateX(-50%);max-width:88vw;text-align:center;
    background:var(--cream-t);padding:9px 18px;border-radius:16px;font-weight:800;font-size:15px;box-shadow:var(--shadow);}

  #quip{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);max-width:86vw;text-align:center;
    background:rgba(61,51,38,.9);color:#fff7ea;padding:9px 16px;border-radius:16px;font-weight:600;font-size:14px;
    opacity:0;transition:opacity .35s,transform .35s;box-shadow:var(--shadow);}
  #quip.show{opacity:1;transform:translateX(-50%) translateY(0);}

  #vignette{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
    background:radial-gradient(ellipse at center,transparent 45%,rgba(255,40,30,.55) 100%);}

  #joystick{position:absolute;width:0;height:0;display:none;pointer-events:none;}
  #joystick .ring{position:absolute;left:-58px;top:-58px;width:116px;height:116px;border-radius:50%;
    background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.5);}
  #joyKnob{position:absolute;width:60px;height:60px;left:-30px;top:-30px;border-radius:50%;
    background:rgba(255,255,255,.85);box-shadow:var(--shadow);}
  #runbtn{position:absolute;right:24px;bottom:32px;width:92px;height:92px;border-radius:50%;pointer-events:auto;
    border:none;background:linear-gradient(180deg,#ffd06b,#ff9b3d);color:#5b3a12;font-weight:900;font-size:19px;
    box-shadow:var(--shadow);cursor:pointer;touch-action:none;}
  #runbtn:active{transform:scale(.94);}
  #atkbtn{position:absolute;right:124px;bottom:46px;width:72px;height:72px;border-radius:50%;pointer-events:auto;
    border:none;background:linear-gradient(180deg,#ff7a6b,#e23b2e);color:#fff;font-weight:900;font-size:28px;
    box-shadow:var(--shadow);cursor:pointer;touch-action:none;}
  #atkbtn:active{transform:scale(.9);}

  /* ---- screens ---- */
  #screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;
    pointer-events:auto;z-index:20;background:radial-gradient(ellipse at top,rgba(143,208,255,.5),rgba(108,194,74,.35));
    backdrop-filter:blur(2px);overflow:auto;}
  #screen.show{display:flex;}
  .panel{background:var(--cream-t);border-radius:26px;box-shadow:var(--shadow);padding:24px 22px;max-width:520px;width:100%;
    text-align:center;animation:pop .35s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
  .logo{font-size:clamp(26px,7vw,42px);font-weight:900;line-height:1.05;color:var(--leaf-d);text-shadow:0 3px 0 rgba(0,0,0,.07);}
  .tagline{margin:8px 0 14px;color:var(--ink-soft);font-weight:600;font-size:15px;}
  .ptitle{font-size:clamp(20px,5vw,28px);font-weight:900;color:var(--leaf-d);margin-bottom:6px;}
  .ptitle .hi{color:var(--pink);}
  .dnaBig{font-weight:800;font-size:18px;margin:6px 0 14px;}
  .hint{margin-top:14px;color:var(--ink-soft);font-size:12.5px;line-height:1.6;}
  .muteRow{margin-top:8px;}
  .fact{font-style:italic;color:var(--ink-soft);margin:6px 14px 14px;font-size:15px;line-height:1.45;}
  .mutLabel{font-weight:800;margin-bottom:8px;}
  .muts{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .mut{display:flex;flex-direction:column;gap:1px;padding:9px 12px;border-radius:14px;text-align:left;}
  .mut b{font-size:15px;} .mut span{font-size:12.5px;color:var(--ink-soft);}
  .mut.good{background:rgba(108,194,74,.22);} .mut.bad{background:rgba(255,91,77,.16);}
  .mut.neutral{background:rgba(0,0,0,.05);color:var(--ink-soft);}

  .btn{pointer-events:auto;border:none;border-radius:16px;font-weight:800;cursor:pointer;font-family:inherit;
    padding:14px 22px;font-size:17px;background:var(--leaf);color:#fff;box-shadow:var(--shadow);transition:transform .1s;}
  .btn:active{transform:scale(.96);}
  .btn.big{display:block;width:100%;font-size:20px;padding:16px;margin:6px 0;background:linear-gradient(180deg,#7fd45a,#4f9a3a);}
  .btn.ghost{background:rgba(0,0,0,.06);color:var(--ink);}
  .btn.small{padding:9px 12px;font-size:13px;width:100%;margin-top:8px;}
  .btn.tiny{padding:6px 12px;font-size:16px;background:rgba(0,0,0,.06);color:var(--ink);}
  .btn.disabled{opacity:.45;cursor:not-allowed;}
  .row{display:flex;gap:10px;margin-top:6px;} .row .btn{flex:1;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:8px 0 16px;}
  .card{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 12px rgba(60,45,25,.12);text-align:center;}
  .card.locked{opacity:.92;}
  .card .swatch{width:46px;height:46px;border-radius:50%;margin:0 auto 8px;box-shadow:inset 0 -4px 8px rgba(0,0,0,.18);}
  .card .cname{font-weight:900;font-size:16px;} .card .cdesc{font-size:11.5px;color:var(--ink-soft);min-height:30px;margin-top:2px;}

  .epitaph{font-style:italic;color:var(--ink-soft);font-size:16px;margin:6px 10px 16px;line-height:1.45;}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .stats>div{background:rgba(0,0,0,.05);border-radius:12px;padding:9px;display:flex;flex-direction:column;}
  .stats span{font-size:11px;color:var(--ink-soft);} .stats b{font-size:18px;}
  .stats .dnaStat{background:rgba(108,194,74,.2);}
  .death.win .ptitle{color:var(--pink);}
  .unlockNote{background:rgba(255,184,77,.25);border-radius:12px;padding:8px;font-weight:700;margin-bottom:12px;}

  /* diet chip + tutorial toast */
  .dietChip{margin-top:3px;align-self:flex-start;background:var(--cream-t);border-radius:12px;padding:4px 10px;font-size:12px;font-weight:700;box-shadow:var(--shadow);}
  #tut{position:absolute;left:50%;top:118px;transform:translateX(-50%) translateY(-8px);max-width:84vw;text-align:center;
    background:rgba(91,74,55,.92);color:#fff7ea;padding:9px 16px;border-radius:14px;font-weight:600;font-size:13.5px;
    opacity:0;transition:opacity .3s,transform .3s;box-shadow:var(--shadow);pointer-events:none;}
  #tut.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* character-select carousel (Slay-the-Spire style) */
  .selectC{max-width:480px;}
  .carousel{display:flex;align-items:center;gap:6px;}
  .navArrow{pointer-events:auto;border:none;background:var(--cream);width:46px;height:46px;flex:0 0 46px;border-radius:50%;
    font-size:28px;line-height:1;font-weight:900;color:var(--leaf-d);box-shadow:var(--shadow);cursor:pointer;}
  .navArrow:active{transform:scale(.92);}
  .bigcard{flex:1;background:#fff;border-radius:22px;padding:14px;box-shadow:0 6px 18px rgba(60,45,25,.16);}
  .preview{width:100%;height:200px;display:block;border-radius:16px;background:linear-gradient(180deg,#cdeeff,#eafaf0);}
  .preview.lockedPrev{filter:grayscale(.85) brightness(.8);}
  .bignameRow{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:8px;}
  .bigname{font-size:24px;font-weight:900;color:var(--leaf-d);}
  .bignum{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .bigdesc{font-size:13px;color:var(--ink-soft);margin:2px 0 8px;}
  .dietRow{font-size:14px;margin-bottom:8px;} .dietRow .eats{color:var(--ink-soft);font-size:12px;}
  .stats3{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
  .stat{display:flex;align-items:center;gap:8px;} .stat>span{width:74px;text-align:left;font-size:12px;font-weight:700;color:var(--ink-soft);}
  .pips{display:flex;gap:4px;} .pips i{width:18px;height:9px;border-radius:4px;background:rgba(0,0,0,.12);}
  .pips i.on{background:var(--leaf);}
  .questBox{background:rgba(255,184,77,.22);border-radius:14px;padding:10px;}
  .questBox .qlabel{font-size:11px;font-weight:800;color:#9a6a1a;letter-spacing:.4px;}
  .questBox .qtext{font-size:15px;font-weight:800;margin-top:2px;}
  .dots{display:flex;justify-content:center;gap:7px;margin:12px 0;}
  .dots i{width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.15);cursor:pointer;}
  .dots i.cur{background:var(--leaf-d);transform:scale(1.3);} .dots i.lk{border:1.5px solid rgba(0,0,0,.25);background:transparent;}

  /* lobby card extras */
  .rarity{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.5px;padding:2px 10px;border-radius:10px;margin-bottom:6px;}
  .rarity.Common{background:#cfd8dc;color:#46535a;} .rarity.Rare{background:#bcdcff;color:#1f5fa6;}
  .rarity.Epic{background:#e6ccff;color:#7b34c9;} .rarity.Legendary{background:linear-gradient(90deg,#ffe08a,#ffb347);color:#7a4a00;}
  .ability{font-size:12px;color:var(--ink-soft);margin:2px 0 8px;line-height:1.4;} .ability b{color:var(--ink);}
  .latin{font-style:italic;color:var(--ink-soft);font-size:12.5px;margin:-2px 0 6px;}
  .badges{display:flex;gap:6px;justify-content:center;margin-bottom:4px;flex-wrap:wrap;}
  .statusword{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.3px;padding:2px 9px;border-radius:10px;background:#cfd8dc;color:#3a4248;}
  .statusword.sLeastConcern{background:#cdeccb;color:#2f6b2c;} .statusword.sNearThreatened{background:#fdf0c2;color:#8a6a14;}
  .statusword.sVulnerable{background:#ffe0b8;color:#9a5a14;} .statusword.sEndangered{background:#ffd2cc;color:#a32a1c;}
  .evoMini{font-size:11px;color:#7c3ae0;font-weight:800;margin-bottom:8px;}
  .cardBtns{display:flex;gap:8px;} .cardBtns .btn{flex:1;margin:0;}
  .btn.evo{background:linear-gradient(180deg,#b07bff,#7c3ae0);}

  /* evolution lab */
  .evoTop{display:flex;justify-content:center;gap:12px;font-weight:800;margin:4px 0 10px;flex-wrap:wrap;}
  .evoTop .pill{background:rgba(0,0,0,.06);border-radius:12px;padding:5px 12px;font-size:13px;} .evoTop .pill b{color:#7c3ae0;}
  .expbar{height:8px;background:rgba(0,0,0,.12);border-radius:6px;overflow:hidden;margin:0 auto 12px;max-width:300px;}
  .expbar>div{height:100%;background:linear-gradient(90deg,#b07bff,#7c3ae0);transition:width .3s;}
  .upgList{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .upg{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px;box-shadow:0 3px 10px rgba(60,45,25,.1);}
  .upg .uico{font-size:20px;width:28px;text-align:center;}
  .upg .uinfo{flex:1;text-align:left;min-width:0;} .upg .uname{font-weight:900;font-size:14px;} .upg .udesc{font-size:11px;color:var(--ink-soft);}
  .upg .upips{display:flex;gap:3px;margin-top:4px;} .upg .upips i{width:15px;height:7px;border-radius:3px;background:rgba(0,0,0,.12);} .upg .upips i.on{background:#7c3ae0;}
  .upg .ubuy{border:none;border-radius:12px;padding:9px 10px;font-weight:800;font-size:12px;background:var(--leaf);color:#fff;cursor:pointer;min-width:62px;}
  .upg .ubuy:disabled{opacity:.4;cursor:not-allowed;} .upg .ubuy.max{background:#ffb347;color:#5b3a12;}

  /* mutation skill tree */
  .tree{display:flex;flex-direction:column;align-items:center;margin-bottom:12px;}
  .tier{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .tierLink{width:3px;height:13px;background:rgba(124,58,224,.35);}
  .snode{border:2px solid transparent;border-radius:14px;padding:8px 6px;width:90px;background:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 8px rgba(60,45,25,.1);font-family:inherit;}
  .snode .sico{font-size:22px;line-height:1;} .snode .sname{font-weight:800;font-size:12px;color:var(--ink);} .snode .scost{font-size:10.5px;color:var(--ink-soft);}
  .snode.owned{border-color:#7c3ae0;background:#f3ecff;} .snode.owned .scost{color:#7c3ae0;font-weight:800;}
  .snode.avail{border-color:#7fd45a;} .snode.cant{opacity:.7;} .snode.locked{opacity:.4;filter:grayscale(.6);}
  .snode:disabled{cursor:default;}
  .snode:not(:disabled):active{transform:scale(.95);}

  /* death rewards */
  .rewards{display:flex;justify-content:center;gap:10px;margin:6px 0 10px;}
  .rewards .rw{background:rgba(124,58,224,.14);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;}
  .rewards .rw.exp{background:rgba(108,194,74,.18);}
  .levelup{background:linear-gradient(90deg,#ffe08a,#ffb347);color:#7a4a00;font-weight:900;border-radius:12px;padding:8px;margin-bottom:10px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dev"></div>

<div id="ui">
  <div id="hud">
    <div class="lifebar-wrap"><div class="fill" id="fillLife"></div></div>
    <div id="stageLabel">Baby</div>
    <div class="needs">
      <div class="need"><span class="lbl">Food</span><div class="bar"><div class="fill" id="fillHunger"></div></div></div>
      <div class="need"><span class="lbl">Energy</span><div class="bar"><div class="fill" id="fillEnergy"></div></div></div>
      <div class="need" id="barWarmthWrap" style="display:none"><span class="lbl">Warmth</span><div class="bar"><div class="fill" id="fillWarmth"></div></div></div>
      <div class="dietChip" id="dietChip"></div>
    </div>
    <div class="topright">
      <div id="clock" class="clock">☀️</div>
      <div class="dna">🧬 <span id="dnaVal">0</span></div>
      <button id="pauseBtn" class="iconbtn" aria-label="Pause">⏸</button>
    </div>
    <div id="objective" class="objective"></div>
    <div id="tut"></div>
  </div>

  <div id="vignette"></div>
  <div id="quip"></div>
  <div id="joystick"><div class="ring"></div><div id="joyKnob"></div></div>
  <button id="atkbtn">⚔</button>
  <button id="runbtn">RUN</button>
</div>

<div id="screen"></div>

<script type="module" src="./src/game.js"></script>
</body>
</html>
