<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140c22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=DotGothic16&display=swap" rel="stylesheet">
<title>Elemon — Osaka 2050</title>
<style>
:root{
  --ink:#1b1230; --ink2:#3b2f5c; --paper:#fff8f0; --paper-t:rgba(255,250,244,.94); --glass:rgba(20,12,40,.72);
  --pink:#ff4fa8; --cyan:#3ff0ff; --yellow:#ffd23a; --lime:#a6ff4a; --violet:#8a5aff; --red:#ff4b5c; --orange:#ff8a2b;
  --pyro:#ff6a2b; --hydro:#2fa8ff; --bio:#5fd35a; --geo:#d39a5c; --echo:#b26bff; --volto:#ffe23a; --cryo:#9fefff; --aero:#a8f5c8; --ecto:#8a5aff; --ferro:#b8c4d0; --astro:#ffd98a; --nucleo:#8aff3a;
  --display:"Dela Gothic One","M PLUS Rounded 1c",system-ui,sans-serif; --body:"M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI",sans-serif; --pixel:"DotGothic16",ui-monospace,monospace;
  --shadow:0 8px 0 rgba(0,0,0,.25),0 14px 34px rgba(10,0,30,.45); --r:16px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#140c22;color:var(--paper);font-family:var(--body);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10;font-weight:700}
#ui .layer{position:absolute;inset:0;pointer-events:none}
.pe{pointer-events:auto}
button{font-family:var(--body);font-weight:900;cursor:pointer;border:none;color:inherit}
.hide{display:none!important}

/* ---------- generic pieces ---------- */
.btn{pointer-events:auto;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:14px;
  background:linear-gradient(180deg,#fff,#ffe9f6);color:var(--ink);font-size:16px;letter-spacing:.4px;box-shadow:0 5px 0 #c73d8a,0 10px 22px rgba(0,0,0,.35);
  transform:skewX(-6deg);transition:transform .08s,filter .15s}
.btn>*{transform:skewX(6deg)}
.btn:active{transform:skewX(-6deg) translateY(4px);box-shadow:0 1px 0 #c73d8a,0 6px 14px rgba(0,0,0,.3)}
.btn.primary{background:linear-gradient(180deg,#ff7ac8,#ff3f9a);color:#fff;box-shadow:0 5px 0 #a3176a,0 10px 22px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.cyan{background:linear-gradient(180deg,#8ffcff,#28c9e8);color:#082036;box-shadow:0 5px 0 #127a9a,0 10px 22px rgba(0,0,0,.35)}
.btn.dark{background:linear-gradient(180deg,#3b2f5c,#241a3e);color:#fff;box-shadow:0 5px 0 #0e0820,0 10px 22px rgba(0,0,0,.35)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.disabled,.btn:disabled{filter:grayscale(1) brightness(.7);pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:900;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.3)}
.el{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:900;color:#160c26;letter-spacing:.3px;text-transform:uppercase}
.panel{background:var(--paper-t);color:var(--ink);border-radius:20px;box-shadow:var(--shadow);border:3px solid var(--ink)}
.halftone{background-image:radial-gradient(rgba(255,255,255,.18) 1.2px,transparent 1.6px);background-size:9px 9px}
.speedlines{background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.0) 0deg 5deg,rgba(255,255,255,.12) 5deg 6deg)}
.title-font{font-family:var(--display);letter-spacing:1px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideL{from{transform:translateX(-120%)}to{transform:translateX(0)}}
@keyframes slideR{from{transform:translateX(120%)}to{transform:translateX(0)}}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,3px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,79,168,.0),var(--shadow)}50%{box-shadow:0 0 0 8px rgba(255,79,168,.35),var(--shadow)}}
@keyframes floatUp{from{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-14px) scale(1.15);opacity:1}to{transform:translate(-50%,-62px) scale(1);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spinIn{from{transform:rotate(-200deg) scale(.2);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}

/* ---------- fade / letterbox / captions ---------- */
#fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .5s;pointer-events:none}
#fade.on{opacity:1}
#caption{position:absolute;left:50%;bottom:calc(14% + var(--safe-b));transform:translateX(-50%);width:min(88vw,760px);text-align:center;font-size:clamp(15px,2.3vw,21px);line-height:1.5;
  color:#fff;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.8);opacity:0;transition:opacity .6s;font-weight:800}
#caption.show{opacity:1}
#titlecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .8s;pointer-events:none}
#titlecard.show{opacity:1}
#titlecard .big{font-family:var(--display);font-size:clamp(46px,11vw,120px);line-height:.95;background:linear-gradient(180deg,#fff 0%,#ffe36b 45%,#ff4fa8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 #1b1230) drop-shadow(0 0 22px rgba(255,79,168,.6));letter-spacing:4px;animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
#titlecard .sub{margin-top:10px;font-family:var(--display);font-size:clamp(14px,2.6vw,24px);color:#3ff0ff;text-shadow:0 0 12px #3ff0ff,0 2px 0 #000;letter-spacing:6px}
#banner{position:absolute;top:calc(16% + var(--safe-t));left:0;padding:10px 40px 10px 22px;background:linear-gradient(90deg,var(--ink) 70%,transparent);font-family:var(--display);font-size:clamp(18px,3vw,28px);
  transform:translateX(-110%);transition:transform .45s cubic-bezier(.2,1.2,.4,1);color:#fff;text-shadow:0 0 12px var(--pink)}
#banner small{display:block;font-family:var(--body);font-size:12px;color:var(--cyan);letter-spacing:3px;text-transform:uppercase}
#banner.show{transform:translateX(0)}

/* ---------- world HUD ---------- */
#hud{opacity:0;transition:opacity .3s}
#hud.show{opacity:1}
.hud-tl{position:absolute;top:calc(10px + var(--safe-t));left:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.clock{display:flex;align-items:center;gap:8px;background:var(--glass);border:2px solid rgba(255,255,255,.22);padding:6px 12px 6px 8px;border-radius:14px;backdrop-filter:blur(6px);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.clock .sun{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:radial-gradient(circle at 30% 30%,#fff7c2,#ffb52e)}
.clock .t{font-family:var(--display);font-size:16px;line-height:1}
.clock .s{font-size:11px;color:var(--cyan);letter-spacing:1.5px;text-transform:uppercase}
.loc{font-size:12px;background:rgba(0,0,0,.35);padding:3px 10px;border-radius:10px}
.objective{max-width:min(62vw,340px);background:linear-gradient(90deg,rgba(255,79,168,.9),rgba(138,90,255,.85));padding:7px 12px;border-radius:12px;font-size:13px;line-height:1.3;box-shadow:0 6px 16px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.4)}
.objective b{display:block;font-size:10px;letter-spacing:2px;color:#ffe36b;text-transform:uppercase}
.hud-tr{position:absolute;top:calc(10px + var(--safe-t));right:10px;display:flex;gap:8px;align-items:center}
.money{font-family:var(--display);background:var(--glass);border:2px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:12px;font-size:15px}
.iconbtn{pointer-events:auto;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(180deg,#fff,#ffe1f2);color:var(--ink);box-shadow:0 4px 0 #c73d8a,0 8px 18px rgba(0,0,0,.35)}
.iconbtn:active{transform:translateY(3px)}
.hud-br{position:absolute;right:12px;bottom:calc(14px + var(--safe-b));display:flex;gap:10px;align-items:flex-end}
.hud-bl{position:absolute;left:12px;bottom:calc(14px + var(--safe-b));display:flex;gap:8px;align-items:flex-end}
.partybub{display:flex;align-items:center;gap:6px;background:var(--glass);padding:5px 10px 5px 5px;border-radius:16px;border:2px solid rgba(255,255,255,.2)}
.partybub .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.minibar{width:64px;height:7px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.minibar>i{display:block;height:100%;background:linear-gradient(90deg,#7dff8a,#3fe0a0);border-radius:9px}
#interact{position:absolute;left:50%;bottom:calc(22% + var(--safe-b));transform:translateX(-50%);display:none}
#interact.show{display:block;animation:pop .3s}
#sneak.on{background:linear-gradient(180deg,#a6ff4a,#54c42a);box-shadow:0 4px 0 #2d7a12,0 8px 18px rgba(0,0,0,.35)}
.stealth{position:absolute;left:50%;top:calc(64px + var(--safe-t));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--glass);padding:6px 14px;border-radius:14px;font-size:12px}
.stealth .bar{width:140px;height:9px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
.stealth .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a6ff4a,#ffd23a,#ff4b5c);transition:width .15s}

/* ---------- labels (world-space) ---------- */
#labels .lab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;will-change:transform}
.unitlab{display:flex;flex-direction:column;align-items:center;gap:2px}
.unitlab .nm{font-size:11px;font-weight:900;text-shadow:0 1px 0 #000,0 0 6px #000;letter-spacing:.3px}
.unitlab .hp{width:64px;height:7px;background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.7);border-radius:6px;overflow:hidden;position:relative}
.unitlab .hp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6dff7a,#33d6a0);transition:width .12s}
.unitlab .hp b{position:absolute;left:0;top:0;bottom:0;background:#fff7b0;transition:width .6s .15s}
.unitlab.enemy .hp i{background:linear-gradient(90deg,#ff6a6a,#ff3f7a)}
.unitlab .sts{display:flex;gap:2px;font-size:11px;min-height:12px}
.unitlab .aura{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor}
.dmg{position:absolute;font-family:var(--display);font-size:20px;color:#fff;-webkit-text-stroke:1.5px #1b1230;text-shadow:0 3px 0 #1b1230;animation:floatUp .9s ease-out forwards;pointer-events:none;white-space:nowrap}
.dmg.crit{font-size:28px;color:#ffe36b}
.dmg.eff{color:#ff8a2b}
.dmg.heal{color:#7dff8a}
.dmg.weak{color:#b9b9c9;font-size:16px}
.dmg.tag{font-family:var(--body);font-weight:900;font-size:14px;color:#3ff0ff}
.npcmark{font-size:20px;animation:pulse 1.2s infinite;filter:drop-shadow(0 2px 0 #000)}

/* ---------- dialogue ---------- */
#dlg{position:absolute;left:50%;bottom:calc(10px + var(--safe-b));transform:translateX(-50%);width:min(96vw,860px);display:none;pointer-events:auto}
#dlg.show{display:block;animation:slideUp .25s ease-out}
#dlg .box{position:relative;margin-left:min(170px,28vw);min-height:118px;padding:22px 22px 16px 26px;background:var(--paper-t);color:var(--ink);border:3.5px solid var(--ink);border-radius:20px 20px 20px 6px;box-shadow:var(--shadow);font-size:clamp(15px,2.2vw,18px);line-height:1.5}
#dlg .name{position:absolute;top:-19px;left:18px;padding:5px 16px;font-family:var(--display);font-size:16px;color:#fff;background:var(--pink);border:3px solid var(--ink);border-radius:12px;transform:skewX(-8deg);box-shadow:0 4px 0 var(--ink)}
#dlg .name span{display:inline-block;transform:skewX(8deg)}
#dlg .more{position:absolute;right:16px;bottom:8px;font-size:15px;animation:blink 1s infinite;color:var(--pink)}
#dlg .portrait{position:absolute;left:0;bottom:0;width:min(180px,30vw);height:min(210px,35vw);border-radius:18px;border:3.5px solid var(--ink);overflow:hidden;box-shadow:var(--shadow);background:transparent}
#dlg .portrait.empty{display:none}
#dlg.noportrait .box{margin-left:0}
#dlg .text .em{color:var(--pink)}
#choices{position:absolute;right:max(3vw,10px);bottom:calc(158px + var(--safe-b));display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:auto}
#choices .btn{min-width:220px;justify-content:flex-start;animation:slideR .25s ease-out both}
#narr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,720px);text-align:center;font-size:clamp(16px,2.6vw,22px);line-height:1.6;color:#fff;text-shadow:0 2px 0 #000;display:none;pointer-events:auto}
#narr.show{display:block;animation:slideUp .4s}

/* ---------- modal screens ---------- */
#modal{display:none;pointer-events:auto;background:rgba(14,6,30,.55);backdrop-filter:blur(3px)}
#modal.show{display:block}
#modal.clear{background:transparent;backdrop-filter:none;pointer-events:none}
#modal.clear .sheet{pointer-events:auto}
.sheet{position:absolute;inset:max(10px,2.5vh) max(10px,2.5vw);display:flex;flex-direction:column;overflow:hidden;animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(90deg,var(--ink),#3a1f6a);color:#fff;border-bottom:3px solid var(--ink)}
.sheet-head h2{margin:0;font-family:var(--display);font-size:clamp(18px,3vw,26px);letter-spacing:1px;flex:1;text-shadow:0 0 10px rgba(255,79,168,.6)}
.sheet-body{flex:1;overflow:auto;padding:14px;color:var(--ink);touch-action:pan-y}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{pointer-events:auto;padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-weight:900;font-size:13px}
.tab.on{background:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{position:relative;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px;box-shadow:0 5px 0 rgba(27,18,48,.25);color:var(--ink);text-align:left}
.card.sel{outline:4px solid var(--pink);outline-offset:2px}
.card .ttl{font-family:var(--display);font-size:16px}
.card .desc{font-size:12px;color:#5a4c78;line-height:1.35;margin-top:4px}
.statrow{display:grid;grid-template-columns:88px 1fr 46px 34px;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.statbar{height:12px;border-radius:8px;background:#ece6f6;overflow:hidden;border:2px solid var(--ink)}
.statbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--violet))}
.plus{width:30px;height:30px;border-radius:9px;background:var(--pink);color:#fff;font-size:18px;box-shadow:0 3px 0 #a3176a}
.plus:disabled{background:#ccc;box-shadow:none}
.slot{display:flex;align-items:center;gap:8px;padding:8px 10px;border:2.5px dashed #b9a9d9;border-radius:12px;min-height:46px;font-size:13px;background:#faf6ff}
.slot.filled{border-style:solid;border-color:var(--ink);background:#fff}
.slot.locked{opacity:.45}
.skillicon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex:none;border:2px solid var(--ink)}
.preview3d{border:3px solid var(--ink);border-radius:16px;background:transparent;min-height:180px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.split{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr;gap:14px}
@media (max-width:720px){.split{grid-template-columns:1fr}}
.muted{color:#7a6c98;font-size:12px}

/* astral tree */
.astral{position:relative;width:100%;height:min(62vh,520px);border-radius:16px;border:3px solid var(--ink);overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#2b1a5a 0%,#120a2a 70%);touch-action:none}
.astral svg{position:absolute;inset:0;width:100%;height:100%}
.astral .node{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#fff;border:2.5px solid rgba(255,255,255,.35);background:#24184a;pointer-events:auto;transition:transform .15s}
.astral .node.lit{background:radial-gradient(circle,#fff6c8,#ffb52e);color:#3a2000;border-color:#fff;box-shadow:0 0 18px #ffd23a}
.astral .node.ready{border-color:var(--cyan);box-shadow:0 0 14px var(--cyan);animation:pulse 1.4s infinite}
.astral .node.locked{opacity:.6}
.astral .node.hidden{opacity:.18}
.astral .node.big{width:50px;height:50px;font-size:20px}
.astral .tip{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.95);color:var(--ink);border-radius:12px;padding:10px;font-size:13px;border:2.5px solid var(--ink)}

/* ---------- battle HUD ---------- */
#bhud{opacity:0;transition:opacity .25s}
#bhud.show{opacity:1}
.bteam{position:absolute;top:calc(10px + var(--safe-t));display:flex;flex-direction:column;gap:6px;max-width:44vw}
.bteam.me{left:10px}.bteam.foe{right:10px;align-items:flex-end}
.ucard{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;background:var(--glass);border:2px solid rgba(255,255,255,.25);border-radius:14px;min-width:min(240px,42vw);backdrop-filter:blur(4px)}
.ucard.active{border-color:#fff;box-shadow:0 0 0 2px var(--pink)}
.ucard.small{min-width:0;padding:3px 8px 3px 3px;opacity:.85}
.ucard .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;border:2px solid rgba(255,255,255,.6);flex:none}
.ucard .info{flex:1;min-width:0}
.ucard .nm{font-size:13px;font-weight:900;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.ucard .lv{font-size:10px;color:var(--cyan)}
.bar{position:relative;height:10px;border-radius:7px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:3px;border:1.5px solid rgba(255,255,255,.4)}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .12s}
.bar .hpf{background:linear-gradient(90deg,#6dff7a,#2fd7a5)}
.bar .hpg{background:#fff6b0;transition:width .7s .2s}
.bar .shd{background:rgba(160,230,255,.85)}
.bar.en{height:5px;margin-top:2px}.bar.en i{background:linear-gradient(90deg,#3ff0ff,#2fa8ff)}
.ucard .sts{font-size:12px;display:flex;gap:2px}
.meters{position:absolute;top:calc(10px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.beat{width:22px;height:22px;border-radius:50%;border:3px solid #fff;opacity:.55;transition:transform .08s}
.beat.on{transform:scale(1.5);opacity:1;background:var(--echo);box-shadow:0 0 14px var(--echo)}
.timer{font-family:var(--display);font-size:14px;color:#fff;text-shadow:0 2px 0 #000}
/* action cluster */
.actions{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(12px + var(--safe-b));width:300px;height:300px;pointer-events:none}
.abtn{position:absolute;pointer-events:auto;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;text-align:center;line-height:1;touch-action:none;
  border:3px solid rgba(255,255,255,.85);box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.35);transition:transform .06s,filter .2s}
.abtn:active,.abtn.down{transform:scale(.92)}
.abtn small{display:block;font-size:9.5px;font-weight:900;letter-spacing:.5px;opacity:.95;margin-top:2px;text-transform:uppercase}
.abtn .ic{font-size:24px}
.abtn.attack{right:0;bottom:0;width:104px;height:104px;background:radial-gradient(circle at 35% 30%,#ff8fb3,#ff2f6a)}
.abtn.attack .ic{font-size:36px}

#dev{position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:60;font:11px monospace;color:#9f9;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:6px;display:none}

</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="ui">
  <div class="layer" id="labels"></div>
  <div class="layer" id="hud"></div>
  <div class="layer" id="bhud"></div>
  <div class="layer" id="cine"><div id="banner"></div><div id="caption"></div><div id="titlecard"></div><div id="narr"></div></div>
  <div class="layer" id="dlgl"><div id="dlg"></div><div id="choices"></div></div>
  <div class="layer" id="tut"></div>
  <div class="layer" id="qte"></div>
  <div class="layer" id="modal"></div>
  <div class="layer" id="title"></div>
  <div class="layer" id="toasts"></div>
  <div class="layer" id="fade"></div>
</div>
<div id="loading"><div class="logo">ELEMON</div><div class="bar"><i id="loadbar"></i></div><div class="msg" id="loadmsg">Linking soul stones…</div></div>
<div id="dev"></div>
<div id="err"></div>
<script>
  window.addEventListener('error', (e) => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += (e.message || e) + '\n' + (e.error && e.error.stack || '') + '\n'; });
  window.addEventListener('unhandledrejection', (e) => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += 'Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason) + '\n'; });
</script>
<script type="module" src="./src/main.js"></script>
</body>
